<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Poppins, system-ui, sans-serif;
      background: linear-gradient(180deg, #070708, #121215);
    }

    .mobile-bottom-nav {
      display: none;
    }

    @media (max-width: 767px) {
      body {
        padding-bottom: 5.5rem;
      }

      .mobile-bottom-nav {
        display: flex;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 999;
        width: 100%;
      }

      .mobile-bottom-nav__inner {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0.3rem;
        width: 100%;
        border-radius: 0;
        padding: 0.45rem 0.75rem;
        margin-bottom: 0;
        background: rgba(15, 15, 17, 0.85);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(24px) saturate(140%);
        -webkit-backdrop-filter: blur(24px) saturate(140%);
      }

      .mobile-bottom-nav__item {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 3rem;
        height: 3rem;
        border-radius: 9999px;
        color: #a1a1aa;
        transition: all 280ms cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .mobile-bottom-nav__item.is-active {
        background: rgba(255, 212, 0, 0.12);
        color: #f5b041;
        box-shadow: 0 4px 16px rgba(255, 212, 0, 0.15), inset 0 0 0 1px rgba(255, 212, 0, 0.25);
      }

      .mobile-bottom-nav__item svg {
        width: 1.45rem;
        height: 1.45rem;
      }
    }
  </style>
</head>
<body class="min-h-screen text-white flex items-center justify-center p-4">
  <main class="w-full max-w-md rounded-3xl border border-white/10 bg-white/5 backdrop-blur-xl p-6 sm:p-8 shadow-2xl">
    <h1 class="text-2xl font-bold mb-6 text-center">Create Account</h1>

    <form class="space-y-4" action="#" method="post">
      <div>
        <label for="name" class="block text-sm text-stone-300 mb-1">Full Name</label>
        <input id="name" name="name" type="text" required class="w-full rounded-xl border border-white/10 bg-black/20 px-4 py-3 outline-none focus:border-amber-400" placeholder="Enter your full name" />
      </div>

      <div>
        <label for="email" class="block text-sm text-stone-300 mb-1">Email</label>
        <input id="email" name="email" type="email" required class="w-full rounded-xl border border-white/10 bg-black/20 px-4 py-3 outline-none focus:border-amber-400" placeholder="Enter your email" />
      </div>

      <div>
        <label for="password" class="block text-sm text-stone-300 mb-1">Password</label>
        <input id="password" name="password" type="password" required class="w-full rounded-xl border border-white/10 bg-black/20 px-4 py-3 outline-none focus:border-amber-400" placeholder="Create password" />
      </div>

      <div>
        <label for="confirmPassword" class="block text-sm text-stone-300 mb-1">Confirm Password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" required class="w-full rounded-xl border border-white/10 bg-black/20 px-4 py-3 outline-none focus:border-amber-400" placeholder="Confirm password" />
      </div>

      <button type="submit" class="w-full rounded-xl bg-amber-400 text-black font-semibold py-3 hover:bg-amber-300 transition">
        Register
      </button>
    </form>
  </main>

  <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
    <div class="mobile-bottom-nav__inner">
      <a href="landing.html" class="mobile-bottom-nav__item" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-8.5Z" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
      <a href="dashboard.html" class="mobile-bottom-nav__item" aria-label="Dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <rect x="3" y="3" width="8" height="8" rx="2" stroke-width="1.6" />
          <rect x="13" y="3" width="8" height="5" rx="2" stroke-width="1.6" />
          <rect x="13" y="10" width="8" height="11" rx="2" stroke-width="1.6" />
          <rect x="3" y="13" width="8" height="8" rx="2" stroke-width="1.6" />
        </svg>
      </a>
      <a href="workout.html" class="mobile-bottom-nav__item"  aria-label="Workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L5 14h6l-1 8 9-12h-6l0-8z"/></svg></a>
      <a href="profile.html" class="mobile-bottom-nav__item" aria-label="More navigation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="1.5" fill="currentColor" />
          <circle cx="19" cy="12" r="1.5" fill="currentColor" />
          <circle cx="5" cy="12" r="1.5" fill="currentColor" />
        </svg>
      </a>
    </div>
  </nav>
</body>
</html>
