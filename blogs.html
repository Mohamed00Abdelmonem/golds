<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blogs — GoldTech</title>
  <script>tailwind.config = { theme: { extend: { colors: { gold: { DEFAULT: '#f5b041' } }, fontFamily: { display:['Poppins','Inter','system-ui','sans-serif'] } } } }</script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="antialiased">
  <div id="app-root"></div>
  <script src="assets/js/components.js"></script>
  <script>
    Components.renderShell({title:'Blogs'});
    Components.init();

    const blogs = [

        image: 'https://images.unsplash.com/photo-1517836357463-d25ddfcbf042?q=80&w=1200&auto=format&fit=crop',
        excerpt: 'Consistency beats intensity. Use these practical gym habits to improve momentum, recovery, and long-term progress.'
      },
      {
        id: 2,
        title: 'The Best Nutrition Timing for Muscle Gain (Without Overthinking)',
        category: 'Nutrition',
        author: 'Dr. Elina Park',
        date: 'May 2026',
        readTime: '8 min read',
        image: 'https://images.unsplash.com/photo-1490645935967-10de6ba17061?q=80&w=1200&auto=format&fit=crop',
        excerpt: 'A clear plan for protein, carbs, and hydration around your training window so your body can recover and build faster.'

      {
        id: 3,
        title: 'How to Avoid Plateaus: Progressive Overload Made Simple',

        author: 'James Carter',
        date: 'May 2026',
        readTime: '5 min read',

      {
        id: 4,
        title: 'Cardio for Lifters: Keep Your Heart Strong Without Losing Gains',
        category: 'Conditioning',
        author: 'Nora Hayes',
        date: 'Apr 2026',
        readTime: '7 min read',

        excerpt: 'A balanced cardio approach for gym members who want better endurance while preserving strength and muscle.'

    document.getElementById('page-content').innerHTML = `

        <div class="glass rounded-3xl p-7 md:p-9">
          <div class="flex flex-wrap items-center justify-between gap-3">

            <span class="px-3 py-1 rounded-full bg-white/5 border border-white/10 text-stone-300">Recovery</span>

                <p class="mt-2 text-sm text-stone-300">${blog.excerpt}</p>
                <div class="mt-4 text-xs text-stone-400">By ${blog.author} • ${blog.date}</div>

              </div>
